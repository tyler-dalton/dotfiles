gui:
  border: rounded
  nerdFontsVersion: "3"
  sidePanelWidth: 0.32
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 2
  shrinkSidePanelsToContent: true
  mainPanelSplitMode: flexible

  scrollHeight: 2
  scrollPastBottom: true
  scrollOffMargin: 2
  filterMode: fuzzy

  wrapLinesInStagingView: true

  timeFormat: "Jan-02 15:04:05"
  shortTimeFormat: "15:04"

  theme:
    activeBorderColor:
      - "#7aa2f7"
      - bold
    inactiveBorderColor:
      - "#565f89"
    searchingActiveBorderColor:
      - "#bb9af7"
      - bold
    optionsTextColor:
      - "#7dcfff"
    selectedLineBgColor:
      - reverse
    inactiveViewSelectedLineBgColor:
      - bold
    unstagedChangesColor:
      - "#f7768e"
    markedBaseCommitFgColor:
      - "#e0af68"
    markedBaseCommitBgColor:
      - "#24283b"
    defaultFgColor:
      - "#c0caf5"
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  log:
    order: topo-order
    showGraph: always

customCommands:
  - key: "O"
    context: "global"
    command: "gh repo view --web"
    description: "Open repository in GitHub"
    # TODO change key. Shift + P already used for push to origin
  - key: "P"
    context: "global"
    command: "gh pr view --web"
    description: "Open pull request in GitHub"
