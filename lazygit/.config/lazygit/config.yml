gui:
  border: rounded
  nerdFontsVersion: "3"
  sidePanelWidth: 0.32
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 2
  shrinkSidePanelsToContent: true
  mainPanelSplitMode: flexible

  scrollHeight: 2
  scrollPastBottom: true
  scrollOffMargin: 2
  filterMode: fuzzy

  wrapLinesInStagingView: true
  showDivergenceFromBaseBranch: arrowAndNumber
  showNumstatInFilesView: true
  fileTreeSortOrder: foldersFirst

  commitAuthorShortLength: 2
  commitAuthorLongLength: 17
  commitHashLength: 7
  splitDiff: auto

  timeFormat: "Jan-02 15:04:05"
  shortTimeFormat: "15:04"

  theme:
    activeBorderColor:
      - "#7aa2f7"
      - bold
    inactiveBorderColor:
      - "#565f89"
    searchingActiveBorderColor:
      - "#bb9af7"
      - bold
    optionsTextColor:
      - "#7dcfff"
    selectedLineBgColor:
      - reverse
    inactiveViewSelectedLineBgColor:
      - bold
    unstagedChangesColor:
      - "#f7768e"
    markedBaseCommitFgColor:
      - "#e0af68"
    markedBaseCommitBgColor:
      - "#24283b"
    defaultFgColor:
      - "#c0caf5"

  customIcons:
    filenames:
      "README.md":
        icon: "\uF48A"
        color: "#7dcfff"
      "Chart.yaml":
        icon: "\uE615"
        color: "#7aa2f7"
      "values.yaml":
        icon: "\uE615"
        color: "#e0af68"
      "package.json":
        icon: "\uE71E"
        color: "#f7768e"
      "package-lock.json":
        icon: "\uF023"
        color: "#bb9af7"
      "astro.config.mjs":
        icon: "\uE6B5"
        color: "#ff966c"
    extensions:
      ".astro":
        icon: "\uE6B5"
        color: "#ff966c"
      ".mdx":
        icon: "\uF48A"
        color: "#c0caf5"
      ".yaml":
        icon: "Ƴ"
        color: "#e06c75"
      ".yml":
        icon: "Ƴ"
        color: "#e06c75"
      ".sh":
        icon: "\uE795"
        color: "#9ece6a"

  showRandomTip: false
  showCommandLog: false
  showBottomLine: true
  showPanelJumps: true

git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  log:
    order: topo-order
    showGraph: always

customCommands:
  - key: "O"
    context: "global"
    command: "gh repo view --web"
    description: "Open repository in GitHub"
