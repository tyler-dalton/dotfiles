# =============
# LAZYGIT - tld 10.05.26
# =============

# GUI / LAYOUT
# -------------

gui:
  border: rounded
  nerdFontsVersion: "3"
  sidePanelWidth: 0.32
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 2
  shrinkSidePanelsToContent: true
  mainPanelSplitMode: flexible

  # NAVIGATION
  scrollHeight: 2
  scrollPastBottom: true
  scrollOffMargin: 2
  filterMode: fuzzy

  # FILES / COMMITS
  wrapLinesInStagingView: true
  showDivergenceFromBaseBranch: arrowAndNumber
  showNumstatInFilesView: true
  fileTreeSortOrder: foldersFirst

  commitAuthorShortLength: 2
  commitAuthorLongLength: 17
  commitHashLength: 7
  splitDiff: auto

  # TIME
  timeFormat: "Jan-02 15:04:05"
  shortTimeFormat: "15:04"

  # THEME
  # -------------

  theme:
    activeBorderColor:
      - "#7aa2f7"
      - bold
    inactiveBorderColor:
      - "#565f89"
    searchingActiveBorderColor:
      - "#bb9af7"
      - bold
    optionsTextColor:
      - "#7dcfff"
    selectedLineBgColor:
      - reverse
    inactiveViewSelectedLineBgColor:
      - bold
    unstagedChangesColor:
      - "#f7768e"
    markedBaseCommitFgColor:
      - "#e0af68"
    markedBaseCommitBgColor:
      - "#24283b"
    defaultFgColor:
      - "#c0caf5"

  # CUSTOM ICONS
  customIcons:
    filenames:
      "README.md":
        icon: "\uF48A"
        color: "#7dcfff"
      "Chart.yaml":
        icon: "\uE615"
        color: "#7aa2f7"
      "values.yaml":
        icon: "\uE615"
        color: "#e0af68"
      "package.json":
        icon: "\uE71E"
        color: "#f7768e"
      "package-lock.json":
        icon: "\uF023"
        color: "#bb9af7"
      "astro.config.mjs":
        icon: "\uE6B5"
        color: "#ff966c"
    extensions:
      ".astro":
        icon: "\uE6B5"
        color: "#ff966c"
      ".mdx":
        icon: "\uF48A"
        color: "#c0caf5"
      ".yaml":
        icon: "Ƴ"
        color: "#e06c75"
      ".yml":
        icon: "Ƴ"
        color: "#e06c75"
      ".sh":
        icon: "\uE795"
        color: "#9ece6a"

  # BRANCH COLORS
  branchColorPatterns:
    "^feat/": "#9ece6a"
    "^fix/": "#f7768e"
    "^docs/": "#7dcfff"
    "^refactor/": "#bb9af7"
    "^chore/": "#e0af68"

  # SPINNER
  spinner:
    frames:
      - "⠋"
      - "⠙"
      - "⠹"
      - "⠸"
      - "⠼"
      - "⠴"
      - "⠦"
      - "⠧"
      - "⠇"
      - "⠏"
    rate: 80

  # UI CLEANUP
  showRandomTip: false
  showCommandLog: false
  showBottomLine: true
  showPanelJumps: true
  authorColors:
    "Tyler Dalton": "#7dcfff"

# GIT
# -------------
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  log:
    order: topo-order
    showGraph: always

# CUSTOM COMMANDS
# -------------
customCommands:
  - key: "O"
    context: "global"
    command: "gh repo view --web"
    description: "Open repository in GitHub"
  - key: "<c-a>"
    context: "global"
    command: "gh run list"
    description: "List GitHub Actions runs"
  - key: "I"
    context: "global"
    command: "gh issue list"
    description: "List GitHub Issues"
